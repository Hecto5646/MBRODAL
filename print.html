<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Imprimir · Agencia El Rodal</title>
<style>@page{size:A4;margin:12mm}body{font:14px Georgia,serif;margin:0;color:#000}.hoja{page-break-after:always;border:2px solid #000;border-radius:10px;padding:14mm;min-height:250mm}
.sello{display:inline-block;border:3px solid #b3202a;color:#b3202a;padding:2px 10px;font:700 13px monospace;transform:rotate(-3deg)}h1{font:700 30px Impact,Arial Narrow,sans-serif;margin:8px 0}
.q{text-align:center;margin:14px 0}.cod{display:block;width:60%;margin:8px auto;border:3px solid #000;font:700 52px Impact,sans-serif;letter-spacing:12px;text-align:center;padding:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm;page-break-after:always}.t{border:1.5px dashed #000;border-radius:8px;padding:6mm;text-align:center;font:12px Arial}.t b{display:block;margin-top:4px}
.bar{background:#ffe9a8;padding:10px;font:14px Arial}@media print{.bar{display:none}}</style></head><body>
<div class="bar"><b>Imprimir:</b> Ctrl+P → A4, escala 100 %, sin márgenes extra, blanco y negro. Necesita internet solo para dibujar los QR. <button onclick="print()">Imprimir</button></div>
<div id="out"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="data.js"></script><script src="print-data.js"></script>
<script>
const U=new URLSearchParams(location.search).get('url')||DATA.config.url,o=document.getElementById('out');
const qr=t=>{const d=document.createElement('div');new QRCode(d,{text:t,width:170,height:170,correctLevel:QRCode.CorrectLevel.M});return d};
DATA.agentes.forEach(a=>{const h=document.createElement('div');h.className='hoja';
 h.innerHTML=`<span class="sello">CONFIDENCIAL</span><h1>Expediente · Agente ${a.nombre}</h1><p>${DATA.historia}</p><p><b>Sospechosos:</b> ${DATA.sospechosos.map(s=>s.n).join(', ')}.</p><hr>
 <ol><li>Escanea este código para abrir tu sección.</li><li>Introduce tu código secreto.</li><li>Recorre ${DATA.salas.map(s=>s.nombre).join(', ')}.</li><li>Apunta en tu medio folio los 4 códigos de cada sala (¡16 dígitos!).</li></ol>
 <div class="q" id="q-${a.id}"></div><div class="q">Tu código secreto:</div><span class="cod">${PRINT.acceso[a.id]}</span>`;o.append(h);$('#q-'+a.id,h).append(qr(`${U}/?a=${a.id}`))});
function $(s,e=document){return e.querySelector(s)}
for(let i=0;i<DATA.salas.length;i++){const g=document.createElement('div');g.className='grid';DATA.agentes.forEach(a=>{const t=document.createElement('div');t.className='t';t.append(qr(`${U}/?a=${a.id}&s=${i+1}`));t.insertAdjacentHTML('beforeend',`<b>Sala ${i+1} · ${DATA.salas[i].nombre}</b>Agente ${a.nombre}`);g.append(t)});o.append(g)}
</script></body></html>
